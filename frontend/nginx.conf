server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API and media are served by Django; point this at the backend service.
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host;
                   proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 10m; }
  location /media/ { proxy_pass http://backend:8000; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /static/ { proxy_pass http://backend:8000; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
